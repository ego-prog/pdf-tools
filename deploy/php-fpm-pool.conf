; Pool PHP-FPM exclusivo do PDF Tools.
; Instalado em /etc/php/8.4/fpm/pool.d/pdf-tools.conf por deploy/install.sh.
;
; Separado do pool "www" do Tiro a Tiro: lá o nginx define
; PHP_VALUE auto_prepend_file=guard.php, e o PHP-FPM mantém esse valor no
; processo para as requisições seguintes — o guard (login + CSRF) acabava
; rodando também no PDF Tools e bloqueava a API.

[pdf-tools]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-pdf-tools.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Poucas requisições, mas pesadas (Ghostscript): processos sob demanda,
; e no máximo 4 operações simultâneas para não esgotar CPU e memória.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
pm.max_requests = 200

; Acima do max_execution_time e do timeout dos processos (120 s):
; última barreira caso um worker trave.
request_terminate_timeout = 330s

; error_log() do PHP vai para o log do PHP-FPM.
catch_workers_output = yes
decorate_workers_output = no

; php_admin_value não pode ser sobrescrito por PHP_VALUE do nginx.
php_admin_value[auto_prepend_file] = none

; Limites de upload (mesmos de php-dev.ini).
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M
php_admin_value[max_file_uploads] = 20
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[memory_limit] = 512M

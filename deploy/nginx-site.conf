# Site nginx do PDF Tools.
# Instalado em /etc/nginx/sites-available/pdf-tools por deploy/install.sh.
# Acesso público pelo proxy /pdf-tools/ do site tiroAtiro.

server {
    listen 127.0.0.1:8081;

    client_max_body_size 110M;

    server_name pdf-tools-interno;

    root /var/www/projetos/pdf-tools/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Pool próprio (deploy/php-fpm-pool.conf), separado do Tiro a Tiro.
        fastcgi_pass unix:/run/php/php8.4-fpm-pdf-tools.sock;
        fastcgi_read_timeout 330s;
    }

    location ~ /\. {
        deny all;
    }
}
